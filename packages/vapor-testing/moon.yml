language: "typescript"
layer: "library"

project:
  title: "@joki-ui/vapor-testing"
  description: "Renders and queries Vue Vapor components in a real browser page with Vitest Browser Mode."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  typecheck:
    description: "Type-check the library, its tests and their Vue fixtures with Vize."
    command: "vize"
    args: ["check", "--tsrs-path", "node_modules/.bin/tsrs", "--tsconfig", "tsconfig.json", "src", "tests"]
    inputs: ["src/**/*", "tests/**/*", "package.json", "tsconfig.json", "vitest.config.ts"]

  test:
    description: "Run the library's own tests in Chromium."
    command: "vp"
    args: ["test", "run", "--config", "vitest.config.ts"]
    deps: ["vapor-testing:browser"]
    inputs: ["src/**/*", "tests/**/*", "package.json", "tsconfig.json", "vitest.config.ts"]

  browser:
    description: "Install the Chromium that the browser tests run in. It does nothing if Chromium is installed."
    command: "playwright"
    args: ["install", "chromium"]
    options:
      cache: false
